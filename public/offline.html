<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Chat — Check your connection</title>
  <style>
    @font-face{font-family:"Google Sans";src:url("/fonts/google-sans-latin-variable.woff2") format("woff2");font-weight:400 700;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#f8fafd;color:#1f1f1f;font:16px/24px "Google Sans",system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
    main{width:100%;max-width:380px;text-align:center;padding:32px 24px;background:#fff;border-radius:24px}img{border-radius:20px}h1{font-size:26px;line-height:32px;font-weight:500;margin:24px 0 12px}p{color:#5f6368;margin:0 0 28px}button{min-width:120px;min-height:48px;border:0;border-radius:24px;padding:12px 24px;font:500 16px/24px "Google Sans",system-ui,sans-serif;color:#fff;background:#0b57d0;cursor:pointer;transition:background-color 120ms}button:hover{background:#0842a0}button:active{background:#06357f}button:focus-visible{outline:2px solid #0b57d0;outline-offset:3px}
    @media(prefers-color-scheme:dark){body{background:#13171c;color:#e3e3e3}main{background:#1e2229}p{color:#c4c7c5}button{background:#a8c7fa;color:#062e6f}button:hover{background:#b8d1fa}button:active{background:#c6dafb}button:focus-visible{outline-color:#a8c7fa}}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body><main><img src="/icons/icon-192.png" width="72" height="72" alt="Chat"><h1>Check your connection</h1><p>Chat needs a connection to load your conversations. Reconnect, then try again.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
